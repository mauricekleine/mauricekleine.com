<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Maurice Kleine</title>
    <meta name="description" content="this page drifted out of orbit" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#11131f" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/maurice.png" />

    <!-- Fonts: Panchang + Supreme via Fontshare, Fragment Mono via Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fragment+Mono&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://api.fontshare.com/v2/css?f[]=panchang@400,600,800&f[]=supreme@400,500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <canvas id="nebula" aria-hidden="true"></canvas>
    <canvas id="stars" aria-hidden="true"></canvas>

    <main class="lost">
      <header class="hero">
        <p class="err-code">err_404: trajectory unknown</p>
        <h1>lost in space</h1>
        <p class="tagline">
          this page drifted out of orbit.<br />or it never existed. hard to
          tell from up here.
        </p>
      </header>

      <section aria-label="where to go instead">
        <p>
          it's not in <a href="/#graveyard">the graveyard</a> either, i
          checked. the stars are nice though. you could stay a minute.
        </p>
        <p class="more-link"><a href="/">← back to earth</a></p>
      </section>
    </main>

    <script src="/texture.js"></script>
    <script src="/stars.js"></script>
    <script async src="https://api.mauricekleine.com/latest.js"></script>
  </body>
</html>
