# compares the live sites, mk.wtf destinations and the profile readme to
# apps/web/src/projects.ts, and keeps one "Drift: mauricekleine.com" issue in step:
# opened or updated on drift, closed once a run is fully clean, left alone when
# a check couldn't run. github disables schedules after 60 quiet days; re-enable
# from the actions tab or run it by hand.
name: drift

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node apps/web/tools/drift-check.mjs
      - name: Update the drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Drift: mauricekleine.com"
          issue=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\"))[0].number // empty")
          drift=$(jq '.drift | length' drift-report.json)
          unknown=$(jq '.unknown | length' drift-report.json)
          printf '%s\n\nfrom [this run](%s). fix the site or apps/web/src/projects.ts; the next clean run closes this issue.\n' \
            "$(jq -r .report drift-report.json)" "$RUN_URL" > body.md
          if [ "$drift" -gt 0 ]; then
            if [ -n "$issue" ]; then gh issue edit "$issue" --body-file body.md
            else gh issue create --title "$title" --body-file body.md; fi
          elif [ "$unknown" -eq 0 ] && [ -n "$issue" ]; then
            gh issue close "$issue" --comment "clean run: $RUN_URL"
          fi
