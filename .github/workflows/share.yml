name: artifact share
on:
  pull_request:
    paths:
      - apps/share/**
      - packages/superthread/**
      - bun.lock
      - package.json
      - .github/workflows/share.yml
  push:
    branches: [main]
    paths:
      - apps/share/**
      - packages/superthread/**
      - bun.lock
      - package.json
      - .github/workflows/share.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: "26.13.0"
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run --cwd apps/share deploy --dry-run
