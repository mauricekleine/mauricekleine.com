[install]
# Only resolve package versions published at least 3 days ago, so a freshly
# compromised release is not installed before it is caught and yanked.
minimumReleaseAge = 259200

# The pre-commit hook runs release bun fmt and canary bun lint on staged files.
[fmt]
printWidth = 120
sortPackageJson = true
# vendored skills, essays the publish pipeline reads verbatim, and generated output
ignorePatterns = [
  ".agents/**",
  "skills/**",
  "apps/web/content/**",
  "apps/web/public/**",
  "apps/web/src/routeTree.gen.ts",
  "packages/superthread/dist/**",
]
